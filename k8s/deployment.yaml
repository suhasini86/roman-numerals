apiVersion: v1
kind: Namespace
metadata:
  name: roman-numerals
  labels:
    name: roman-numerals

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roman-numerals-config
  namespace: roman-numerals
data:
  application.yml: |
    spring:
      application:
        name: roman-numerals-service
      jmx:
        enabled: false
      web:
        cors:
          allowed-origins: "*"
          allowed-methods: "GET,POST,OPTIONS"
    
    server:
      port: 8080
      compression:
        enabled: true
    
    management:
      endpoints:
        web:
          exposure:
            include: health,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    
    logging:
      level:
        root: INFO
        com.adobe.assessment: DEBUG

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roman-numerals-deployment
  namespace: roman-numerals
  labels:
    app: roman-numerals
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: roman-numerals
  template:
    metadata:
      labels:
        app: roman-numerals
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: roman-numerals-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: roman-numerals-app
        image: ghcr.io/suhasini86/roman-numerals:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC"
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 2
          failureThreshold: 30
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - roman-numerals
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: roman-numerals-service
  namespace: roman-numerals
  labels:
    app: roman-numerals
spec:
  type: ClusterIP
  selector:
    app: roman-numerals
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: roman-numerals-hpa
  namespace: roman-numerals
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: roman-numerals-deployment
  minReplicas: 2
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: roman-numerals-pdb
  namespace: roman-numerals
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: roman-numerals

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roman-numerals-sa
  namespace: roman-numerals

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roman-numerals-role
  namespace: roman-numerals
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roman-numerals-rolebinding
  namespace: roman-numerals
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: roman-numerals-role
subjects:
- kind: ServiceAccount
  name: roman-numerals-sa
  namespace: roman-numerals

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roman-numerals-network-policy
  namespace: roman-numerals
spec:
  podSelector:
    matchLabels:
      app: roman-numerals
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: roman-numerals
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

